name: Deploy to GitHub Pages

on:
  push:
    # this branch is currently the repo default; `main` is listed so the
    # deploy keeps working if the branch is renamed or merged later
    branches: [main, claude/mobile-arcgis-photo-app-6sbfip]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Stamp the build id into the app + service worker so every deploy busts
      # the old cache and the About screen shows what's running.
      - name: Stamp build id
        run: |
          BUILD="${GITHUB_SHA::7}"
          sed -i "s/__BUILD__/$BUILD/g" sw.js js/config.js
          echo "Built $BUILD"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
